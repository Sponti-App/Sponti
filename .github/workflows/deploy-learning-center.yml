name: Deploy Learning Center

# Publishes docs/learning/ as a GitHub Pages site.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
on:
  push:
    branches: [main]
    paths: ["docs/learning/**", ".github/workflows/deploy-learning-center.yml"]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deploy; don't cancel an in-progress run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Upload learning center
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/learning
      - id: deployment
        uses: actions/deploy-pages@v4
