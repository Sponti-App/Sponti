# Keeps the host's journal, which holds the container logs (docker-compose.yml
# logs to journald), for 14 days at most. Installed by hand once, see README.md
# "Logs": it is copied to /etc/systemd/journald.conf.d/sponti-retention.conf.
[Journal]
# Journal files whose entries are all older than this are deleted.
MaxRetentionSec=14day
# journald deletes whole files only, and only rotates a file after MaxFileSec
# (default: 1 month). Rotating daily means old entries are not kept in an open
# file past their time.
MaxFileSec=1day
